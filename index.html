<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consular Network | Singapore Overseas Missions</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-weight: 300; letter-spacing: 0.1em; font-size: 0.8rem; color: var(--text-dim);">INITIALIZING CONSULAR NETWORK</p>
    </div>

    <div id="login-overlay">
        <div class="login-card">
            <h1 style="margin-bottom: 8px;">🇸🇬 Consular Network</h1>
            <p style="color: var(--text-dim); font-size: 0.875rem; margin-bottom: 24px;">Please enter the access password</p>
            <div class="search-container" style="margin-top: 0;">
                <input type="password" id="password-input" class="search-input" placeholder="Password" autofocus>
                <button id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 16px; padding: 12px;">Access Map</button>
            </div>
            <p id="login-error" style="color: #ef4444; font-size: 0.75rem; margin-top: 12px; min-height: 16px; text-align: center;"></p>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>🇸🇬 Consular Network</h1>
            <div class="search-container">
                <input type="text" class="search-input" id="search" placeholder="Search location or mission...">
                <div class="search-spinner" id="search-spinner"></div>
            </div>
            <div class="search-status" id="search-status"></div>
        </div>
        <div class="mission-list" id="list">
            <!-- List items will be injected here -->
        </div>
    </div>

    <div class="info-panel" id="info-panel">
        <button class="close-btn" onclick="closeInfoPanel()"><span>✕</span></button>
        <div id="info-content"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
