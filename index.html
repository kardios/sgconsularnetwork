<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Global Consular Network</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-weight: 300; letter-spacing: 0.1em; font-size: 0.8rem; color: var(--text-dim);">INITIALIZING CONSULAR NETWORK</p>
    </div>

    <div id="login-overlay">
        <div class="login-card">
            <h1>🇸🇬 Singapore Global Consular Network</h1>
            <p style="color: var(--text-dim); font-size: 0.875rem; margin-bottom: 24px; font-weight: 300;">Authentication Required</p>
            <div class="search-container" style="margin-top: 0;">
                <input type="password" id="password-input" class="search-input" placeholder="Enter Password" autofocus>
                <button id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 20px; padding: 14px; border: none; cursor: pointer;">Access Network</button>
            </div>
            <p id="login-error" style="color: #f87171; font-size: 0.75rem; margin-top: 16px; min-height: 16px;"></p>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>SG Consular Network</h1>
            </div>
            <div class="search-container">
                <input type="text" class="search-input" id="search" placeholder="Search location or mission...">
                <div class="search-spinner" id="search-spinner"></div>
            </div>
            <div class="search-status" id="search-status"></div>
        </div>
        <div class="mission-list" id="list">
            <!-- List items will be injected here -->
        </div>
    </div>

    <div class="info-panel" id="info-panel">
        <button class="close-btn" id="close-info-btn"><span>✕</span></button>
        <div id="info-content"></div>
        <div class="mfa-hq-card">
            <h3 class="mfa-hq-title">🇸🇬 MFA HQ Consular Response Centre</h3>
            <p class="mfa-hq-subtitle">24-Hour Emergency Hotlines</p>
            <div class="info-row">
                <div class="info-label">Emergency</div>
                <div class="info-value"><a href="tel:+6563798800" class="tel-link emergency-highlight">+65 6379 8800</a></div>
            </div>
            <div class="info-row">
                <div class="info-label">General Line</div>
                <div class="info-value"><a href="tel:+6563798000" class="tel-link">+65 6379 8000</a></div>
            </div>
            <div class="info-row">
                <div class="info-label">Email</div>
                <div class="info-value"><a href="mailto:mfa@mfa.gov.sg" class="email-link">mfa@mfa.gov.sg</a></div>
            </div>
            <div class="info-row">
                <div class="info-label">Website</div>
                <div class="info-value"><a href="https://www.mfa.gov.sg" target="_blank" class="web-link">www.mfa.gov.sg</a></div>
            </div>
        </div>
    </div>

    <template id="tpl-info-panel">
        <div class="popup-content" style="padding: 0;">
            <h3 class="tpl-name" style="font-size: 1.25rem; margin-top: 8px; margin-bottom: 16px;"></h3>
            
            <div class="info-row tpl-address-row">
                <div class="info-label">Address</div>
                <div class="info-value tpl-address"></div>
            </div>
            
            <div class="info-row tpl-phone-row">
                <div class="info-label">Phone</div>
                <div class="info-value"><a class="tpl-phone" style="color: var(--accent-blue); text-decoration: none;"></a></div>
            </div>
            
            <div class="info-row tpl-email-row">
                <div class="info-label">Email</div>
                <div class="info-value"><a class="tpl-email" style="color: var(--accent-blue); text-decoration: none;"></a></div>
            </div>
            
            <div class="info-row tpl-emergency-row">
                <div class="info-label">Emergency</div>
                <div class="info-value"><span class="tpl-emergency" style="color: #ef4444; font-weight: 600;"></span></div>
            </div>
            
            <div class="info-row tpl-appointment-row">
                <div class="info-label">Appointment</div>
                <div class="info-value tpl-appointment"></div>
            </div>
            
            <div class="info-row tpl-hours-row" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                <div class="info-label" style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                    Operating Hours
                    <span class="status-badge tpl-status"></span>
                </div>
                <div style="font-size: 0.875rem; font-weight: 600; color: var(--text-main); margin-bottom: 8px;">
                    <span class="tpl-local-datetime"></span> <span style="font-weight: 300; color: var(--text-dim); font-size: 0.75rem;">(Local Time)</span>
                </div>
                <div class="info-value tpl-hours-list" style="width: 100%;"></div>
            </div>
            
            <div class="info-row tpl-covers-row">
                <div class="info-label">Covers</div>
                <div class="info-value tpl-covers"></div>
            </div>
            
            <div class="popup-actions" style="display: flex; gap: 8px; margin-top: 16px;">
                <a class="btn btn-primary tpl-website" target="_blank" style="flex: 1;">Official Site</a>
            </div>
        </div>
    </template>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
